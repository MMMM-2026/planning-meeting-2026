<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Planning Meeting 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Playfair+Display:ital,wght@0,700;0,900;1,600;1,700&family=Cinzel:wght@600;700&family=Public+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --bg:#f5f0f9;--surface:#fff;--ink:#1d0f2e;--muted:#6b5a80;--line:#e4d9ee;
  --navy:#3b145c;--royal:#2a0b45;--brass:#c79a3a;--gold-hi:#f3d38a;--brass-soft:#f8eed6;
  --ok:#1f7a4d;--ok-soft:#dff2e8;--warn:#9a6200;--warn-soft:#fbefd6;--bad:#a3302a;--bad-soft:#f8e0de;
  --f-display:"Playfair Display",Georgia,"Times New Roman",serif;--f-cap:"Cinzel",Georgia,serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12061e;--surface:#1e0d31;--ink:#f3edf9;--muted:#b6a5cb;--line:#372350;--navy:#5d2a8a;--royal:#1a0730;--brass:#e0b65a;--brass-soft:#2f2212;
  --ok:#5fcf95;--ok-soft:#163326;--warn:#f0b74f;--warn-soft:#33280f;--bad:#f08a82;--bad-soft:#3a1c1a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12061e;--surface:#1e0d31;--ink:#f3edf9;--muted:#b6a5cb;--line:#372350;--navy:#5d2a8a;--royal:#1a0730;--brass:#e0b65a;--brass-soft:#2f2212;
  --ok:#5fcf95;--ok-soft:#163326;--warn:#f0b74f;--warn-soft:#33280f;--bad:#f08a82;--bad-soft:#3a1c1a;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:580px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:18px}
.wide{max-width:1000px}
.hero{color:#fff;border-radius:20px;padding:26px 20px 22px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;position:relative;overflow:hidden;isolation:isolate;
  background:radial-gradient(120% 80% at 50% 0%,rgba(255,214,130,.38),rgba(196,140,50,.08) 45%,transparent 70%),linear-gradient(160deg,#2a0b45,#4a1a6e 55%,#1a0730);border:1px solid rgba(232,194,122,.35)}
.hero::before{content:"";position:absolute;inset:-60%;z-index:-1;background:repeating-conic-gradient(from 0deg at 50% 18%,rgba(255,224,160,.10) 0deg 4deg,transparent 4deg 11deg);animation:spin 90s linear infinite}
.hero::after{content:"";position:absolute;left:12px;right:12px;bottom:10px;height:1px;background:linear-gradient(90deg,transparent,#e8c27a,transparent)}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.hero::before,.tk-rays{animation:none}}
.hero .crest{width:92px;height:auto;filter:drop-shadow(0 6px 18px rgba(0,0,0,.35))}
.hero h1{background:linear-gradient(180deg,#fff7df,#f3d38a 55%,#c79a3a);-webkit-background-clip:text;background-clip:text;color:transparent}
.eyebrow{font-family:var(--f-cap);font-weight:700;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#e8c27a}
h1{font-family:var(--f-display);font-weight:900;font-size:clamp(30px,8vw,42px);line-height:1.05;margin:0}
h2{font-family:var(--f-display);font-weight:700;font-size:22px;margin:0}
h3{font-family:var(--f-display);font-weight:700;font-size:18px;margin:0}
p{margin:0}
.muted{color:var(--muted)}.small{font-size:13px}
.prog{display:flex;flex-direction:column;gap:10px}.prog-row{display:flex;flex-direction:column;gap:2px;padding-left:12px;border-left:3px solid var(--brass)}.prog-row span{color:var(--muted);font-size:14px}
.hero .facts{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:8px}
.hero .fact{border:1px solid rgba(232,194,122,.55);background:rgba(0,0,0,.18);border-radius:999px;padding:4px 12px;font-size:13px;color:#fff3d6}
nav.tabs{display:flex;gap:6px;flex-wrap:wrap}
nav.tabs a{font-size:14px;padding:8px 12px;border-radius:9px;color:var(--muted);text-decoration:none;border:1px solid transparent}
nav.tabs a[aria-current="page"]{background:var(--navy);color:#fff;border-color:var(--brass);font-weight:600}
.panel{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--brass);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px}
form{display:flex;flex-direction:column;gap:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid2>*{min-width:0}
@media (max-width:460px){.grid2{grid-template-columns:1fr}}
label{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600}
.hint{font-weight:400;color:var(--muted)}
input,select{font:inherit;font-weight:400;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:10px 12px;width:100%}
input:focus,select:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.plate-in{font-family:var(--f-mono);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.check{flex-direction:row;align-items:flex-start;gap:10px;font-weight:400}.check input{width:auto;margin-top:3px}
.types{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.types.aux{grid-template-columns:repeat(2,1fr)}
.types label{border:1px solid var(--line);border-radius:10px;padding:10px;flex-direction:row;align-items:center;gap:8px;cursor:pointer;font-weight:600}
.types input{width:auto}
.types label:has(input:checked){border-color:var(--navy);background:var(--brass-soft)}
@media (max-width:420px){.types{grid-template-columns:1fr}}
button,.btn{font:inherit;font-weight:600;border:0;border-radius:10px;padding:12px 16px;cursor:pointer;background:linear-gradient(180deg,#4a1a6e,#2a0b45);color:#fff;box-shadow:inset 0 0 0 1px rgba(232,194,122,.35);text-align:center;text-decoration:none;display:inline-block}
.ghost{background:transparent!important;color:var(--ink)!important;border:1px solid var(--line)!important}
.brass{background:linear-gradient(180deg,#f6dc98,#d4a24c 55%,#a8761f)!important;color:#2a0b45!important;box-shadow:none}
.okb{background:var(--ok);color:#fff}
button:disabled{opacity:.55;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.err{color:var(--bad);font-size:13px}
.note{border-radius:10px;padding:12px 14px;font-size:14px;background:var(--brass-soft)}
.note.demo{background:var(--warn-soft)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.room{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;transition:transform .15s,border-color .15s;text-decoration:none;color:var(--ink);display:flex;flex-direction:column;gap:6px}
.room b{font-family:var(--f-display);font-size:17px}
.room span{font-size:13px;color:var(--muted)}
.room:hover{transform:translateY(-2px);border-color:var(--brass)}
.room .ic{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#5d2a8a,#2a0b45);color:#f3d38a;box-shadow:0 0 0 2px #c79a3a}
.room .ic svg{width:22px;height:22px}
.ticket{background:var(--surface);border:1px solid rgba(199,154,58,.55);border-radius:18px;overflow:hidden;box-shadow:0 10px 30px rgba(42,11,69,.18)}
.ticket-head{position:relative;overflow:hidden;isolation:isolate;background:radial-gradient(90% 120% at 15% 0%,rgba(255,214,130,.35),transparent 60%),linear-gradient(150deg,#2a0b45,#4a1a6e 60%,#1a0730);color:#fff;padding:18px;display:flex;justify-content:space-between;gap:12px;align-items:flex-start;border-bottom:3px solid #c79a3a}
.ticket-head .tkcrest{width:54px;height:auto;flex:none}
.tk-rays{position:absolute;inset:-80%;z-index:-1;background:repeating-conic-gradient(from 0deg at 20% 20%,rgba(255,224,160,.09) 0deg 4deg,transparent 4deg 12deg);animation:spin 120s linear infinite}
.ticket-head h2{color:#fff;font-size:19px}
.ticket-body{padding:18px;display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center}
.perf{border-top:2px dashed var(--line);margin:0 14px}
.plate{background:#fbfbf7;color:#111;border:3px solid #111;border-radius:8px;padding:6px 18px 4px;font-family:var(--f-mono);font-weight:700;font-size:clamp(24px,7vw,32px);letter-spacing:.08em;display:inline-flex;flex-direction:column;align-items:center;line-height:1.1}
.plate small{font-size:9px;letter-spacing:.2em;font-weight:500}
.qr{background:#fff;padding:12px;border-radius:14px;display:inline-block;border:3px solid transparent;background:linear-gradient(#fff,#fff) padding-box,linear-gradient(135deg,#fff0c2,#d4a24c 40%,#8a5d14 70%,#f3d38a) border-box;box-shadow:0 0 0 6px rgba(199,154,58,.15),0 0 34px rgba(212,162,76,.35)}
.code{font-family:var(--f-mono);font-weight:700;font-size:22px;letter-spacing:.18em;color:var(--navy)}
.who strong{font-family:var(--f-display);font-size:18px;display:block}
.status{font-family:var(--f-mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;padding:6px 12px;border-radius:999px;display:inline-block}
.st-pending{background:var(--warn-soft);color:var(--warn)}.st-reg{background:linear-gradient(180deg,#f6dc98,#d4a24c);color:#2a0b45}.st-paid{background:var(--ok-soft);color:var(--ok)}.st-in{background:var(--brass-soft);color:var(--ink)}
.bay{font-family:var(--f-display);font-weight:700;font-size:19px;border:2px solid var(--brass);background:var(--brass-soft);color:var(--ink);border-radius:12px;padding:8px 16px}
.seal{display:flex;flex-direction:column;align-items:center;justify-content:center;width:132px;height:132px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff0c2,#d4a24c 55%,#8a5d14);color:#2a0b45;box-shadow:0 0 0 4px #f3d38a,0 0 0 7px #8a5d14,0 8px 24px rgba(138,93,20,.4);font-family:var(--f-cap);font-weight:700;text-align:center;line-height:1.1}
.seal b{font-size:26px;letter-spacing:.08em}.seal span{font-size:11px;letter-spacing:.12em;margin-top:4px}
.verdict{width:100%;border-radius:12px;padding:16px;font-family:var(--f-display);font-size:22px;font-weight:700}
.v-ok{background:var(--ok-soft);color:var(--ok)}.v-warn{background:var(--warn-soft);color:var(--warn)}.v-in{background:var(--brass-soft)}
.pay{width:100%;text-align:left;display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px;margin:0}
.pay dt{color:var(--muted)}.pay dd{margin:0;font-weight:600;overflow-wrap:anywhere}.mono{font-family:var(--f-mono)}
.bays{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bayc{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:4px}
.bayc b{font-family:var(--f-display);font-size:22px}
.bayc span{font-size:12px;color:var(--muted)}
.meter{height:8px;border-radius:5px;background:var(--line);overflow:hidden}.meter i{display:block;height:100%;background:linear-gradient(90deg,#c79a3a,#f3d38a)}
@media (max-width:420px){.bays{grid-template-columns:1fr}}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--brass);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column}
.kpi span{font-size:12px;color:var(--muted)}.kpi b{font-family:var(--f-display);font-size:24px;font-variant-numeric:tabular-nums}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:760px}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--bg)}
td button{padding:6px 10px;font-size:12px;border-radius:7px}
.tag{font-size:10px;font-family:var(--f-mono);text-transform:uppercase;letter-spacing:.08em;padding:2px 6px;border-radius:5px;background:var(--brass-soft);color:var(--ink)}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:minmax(0,1.2fr) 2fr auto;gap:10px;align-items:center;font-size:13px}
.bar .track{height:8px;background:var(--line);border-radius:5px;overflow:hidden}.bar .track i{display:block;height:100%;background:var(--navy)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:20}
.blessing{font-family:var(--f-display);font-style:italic;color:var(--muted);font-size:16px}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast" hidden></div>
<script>
/* ============ SETTINGS ============ */
const CONFIG={
  API_URL:"https://script.google.com/macros/s/AKfycbzEC7iKmpth4-49of8HKGMdwk__d1zkV6y9cEUZESVeUu-_bNqoIkCc_VPC1dhYlgvC/exec",
  SITE_URL:"",
  EVENT:"19th Episcopal District Planning Meeting",
  APP:"Planning Meeting 2026",
  HOST:"Ebenezer AME Church",
  HOST_PLACE:"Atteridgeville",
  DATES:"2 to 6 December 2026",
  PROGRAMME:[
    {day:"Wednesday 2 December",what:"19th Episcopal District Women's Missionary Society Convention"},
    {day:"Thursday 3 to Sunday 6 December",what:"Planning Meeting and BCE Congress, closing on Sunday"}
  ],
  THEME:"Reviving the Connection: Exceedingly, Abundantly Above All We Can Ask or Think",
  EDIT_LIVE:true,        // turn on once the Apps Script has updateReg and fixReg
  REG_FEE:0,             // registration fee in rand; 0 = no fee
  PARK_FEE:50,
  BAYS:[
    {id:"P",name:"Bay 1 · Bishops, Presiding Elders and Pastors",short:"Clergy bay",cap:0,clergy:true},
    {id:"A",name:"Bay 2 · General",short:"General bay",cap:80},
    {id:"B",name:"Bay 3 · General",short:"Second general bay",cap:30}
  ],
  BANK:{bank:"Standard Bank",accountName:"Ebenezer AME Church",accountNumber:"10290264284",branchCode:"051001"},
  CONTACT:{name:"Aggy Mokone",phone:"072 192 9010"},
  WORSHIP_URL:"",        // later: link or embed of the order of worship
  DEMO_PINS:{admin:"1111",registration:"2222",ebenezer:"3333",marshal:"4444"}
};
const LIVE=!!CONFIG.API_URL;
const ROLE_NAME={admin:"Organiser",registration:"Registration team",ebenezer:"Ebenezer host team",marshal:"Gate marshal"};
const CAN={
  regDesk:r=>r==="admin"||r==="registration",
  parkDesk:r=>r==="admin"||r==="ebenezer",
  gate:r=>r==="admin"||r==="ebenezer"||r==="marshal",
  markPaid:r=>r==="admin"||r==="ebenezer"
};

/* ============ STORAGE ============ */
const mem={};
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return k in mem?mem[k]:d}},set(k,v){mem[k]=v;try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const sess={get(k){try{return sessionStorage.getItem(k)}catch(e){return mem["s_"+k]||null}},set(k,v){mem["s_"+k]=v;try{sessionStorage.setItem(k,v)}catch(e){}},del(k){delete mem["s_"+k];try{sessionStorage.removeItem(k)}catch(e){}}};
const nowIso=()=>new Date().toISOString();
const normPlate=s=>String(s||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
const digits=s=>String(s||"").replace(/\D/g,"");
function mkCode(p){const a="ACDEFHJKMNPRTUVWXY3479";let s=p;for(let i=0;i<4;i++)s+=a[Math.floor(Math.random()*a.length)];return s}

/* ============ DEMO DATA ============ */
function seed(){
  const regs=[
    ["Molefe","Thabo","Vaal Conference","Clergy","Pastor","Lay Organization"],
    ["Dlamini","Nomsa","M.M. Mokone Memorial Conference","Delegate","Steward","WMS"],
    ["Seleka","Kagiso","M.M. Mokone Memorial Conference","Delegate","Class Leader","Sons of Allen"],
    ["Mokoena","Lerato","Free State Conference","Clergy","Presiding Elder","None"],
    ["Nkosi","Palesa","Vaal Conference","Observer","Member","ACE League"]
  ].map((r,i)=>({code:"PMSMP"+(i+1),created:nowIso(),surname:r[0],names:r[1],email:"sample"+(i+1)+"@example.com",mobile:"07X XXX XXXX",church:"Sample church",district:"Sample district",conference:r[2],type:r[3],designation:r[4],auxiliary:r[5],consent:true,sample:true}));
  const park=[
    ["Rev.","Thabo Molefe","HJ 42 KL GP","White Toyota Corolla","P","paid","EFT","PMSMP1"],
    ["Sis.","Nomsa Dlamini","CX 18 TR GP","Silver VW Polo","A","paid","EFT","PMSMP2"],
    ["Bro.","Kagiso Seleka","FTG 812 NW","Grey Nissan NP200","A","pending","","PMSMP3"],
    ["Rev.","Lerato Mokoena","DPK 334 FS","Blue Hyundai i20","P","in","EFT","PMSMP4"]
  ].map((r,i)=>({code:"EBSMP"+(i+1),created:nowIso(),title:r[0],name:r[1],phone:"07X XXX XXXX",conference:"Sample",plate:r[2],car:r[3],bay:r[4],status:r[5],method:r[6],reg:r[7],paidAt:r[5]!=="pending"?nowIso():"",checkedAt:r[5]==="in"?nowIso():"",source:"Sample",sample:true}));
  return {regs,park};
}
function db(){let d=store.get("pm26",null);if(!d){d=seed();store.set("pm26",d)}return d}
function save(d){store.set("pm26",d)}
function pinRole(pin){for(const[k,v]of Object.entries(CONFIG.DEMO_PINS))if(v===pin)return k;return null}
function assignBay(parks,clergy){
  const used=id=>parks.filter(x=>x.bay===id&&x.status!=="cancel").length;
  if(clergy)return "P";
  for(const b of CONFIG.BAYS){if(b.clergy)continue;if(used(b.id)<b.cap)return b.id}
  return null;
}

async function api(action,p={}){
  if(LIVE){
    const r=await fetch(CONFIG.API_URL,{method:"POST",body:JSON.stringify({action,...p})});
    const j=await r.json();if(!j.ok)throw new Error(j.error||"Something went wrong");return j.data;
  }
  const d=db();
  const need=f=>{const r=pinRole(p.pin);if(!r||!f(r))throw new Error("You do not have access to this.");return r};
  const findP=c=>d.park.find(x=>x.code===String(c||"").toUpperCase().trim());
  const findR=c=>d.regs.find(x=>x.code===String(c||"").toUpperCase().trim());
  switch(action){
    case "register":{
      const em=String(p.email||"").toLowerCase().trim();
      const dup=d.regs.find(x=>x.email.toLowerCase()===em||digits(x.mobile).slice(-9)===digits(p.mobile).slice(-9));
      if(dup)throw new Error("You are already registered. Use Find my ticket.");
      let code;do{code=mkCode("PM")}while(findR(code));
      const rec={code,created:nowIso(),title:p.title||"",surname:p.surname,names:p.names,email:em,mobile:p.mobile,church:p.church,district:p.district,conference:p.conference,type:p.type,designation:p.designation,auxiliary:p.auxiliary,consent:!!p.consent};
      d.regs.push(rec);save(d);return rec}
    case "getRegFull":{const r=findR(p.code);if(!r)throw new Error("No registration found with that code.");const ok=p.pin?!!(pinRole(p.pin)&&CAN.regDesk(pinRole(p.pin))):(digits(p.mobile).length>=9&&digits(p.mobile).slice(-9)===digits(r.mobile).slice(-9));if(!ok)throw new Error("That mobile number does not match this registration.");return r}
    case "editReg":{need(CAN.regDesk);const r=findR(p.code);if(!r)throw new Error("No registration found with that code.");Object.assign(r,cleanEdit(p.changes),{edited:nowIso(),editedBy:"desk"});save(d);return r}
    case "fixReg":{const r=findR(p.code);if(!r||digits(r.mobile).slice(-9)!==digits(p.mobile).slice(-9))throw new Error("That mobile number does not match this registration.");Object.assign(r,cleanEdit(p.changes),{edited:nowIso(),editedBy:"self"});save(d);return r}
    case "getReg":{const r=findR(p.code);if(!r)throw new Error("No registration found with that code.");return r}
    case "findReg":{const r=d.regs.find(x=>digits(x.mobile).slice(-9)===digits(p.mobile).slice(-9)&&x.surname.toLowerCase()===String(p.surname||"").toLowerCase().trim());if(!r)throw new Error("No registration matches that surname and mobile number.");return r}
    case "bayStats":{return CONFIG.BAYS.map(b=>({id:b.id,cap:b.cap,used:d.park.filter(x=>x.bay===b.id&&x.status!=="cancel").length}))}
    case "book":{
      const plate=normPlate(p.plate);
      if(d.park.some(x=>normPlate(x.plate)===plate&&x.status!=="cancel"))throw new Error("This car registration is already booked. Use Find my pass.");
      if(p.walkin)need(CAN.gate);
      const bay=assignBay(d.park,!!p.clergy);if(!bay)throw new Error("All general bays are full.");
      let code;do{code=mkCode("EB")}while(findP(code));
      const rec={code,created:nowIso(),title:p.title,name:p.name,phone:p.phone,church:p.church||"",district:p.district||"",conference:p.conference,plate:String(p.plate).toUpperCase(),car:p.car,bay,reg:p.reg||"",status:p.walkin?"paid":"pending",method:p.walkin?p.method:"",paidAt:p.walkin?nowIso():"",checkedAt:"",source:p.walkin?"Gate":"Online"};
      d.park.push(rec);save(d);return rec}
    case "getPass":{const r=findP(p.code);if(!r)throw new Error("No pass found with that code.");return r}
    case "findPass":{const r=d.park.find(x=>normPlate(x.plate)===normPlate(p.plate)&&digits(x.phone).slice(-4)===String(p.last4||""));if(!r)throw new Error("No booking matches that registration and phone number.");return r}
    case "auth":{const r=pinRole(p.pin);if(!r)throw new Error("That PIN is not correct.");return{role:r}}
    case "regList":need(CAN.regDesk);return d.regs
    case "parkList":need(CAN.gate);return d.park
    case "markPaid":{need(CAN.markPaid);const r=findP(p.code);r.status="paid";r.method=p.method||"EFT";r.paidAt=nowIso();save(d);return r}
    case "unpay":{need(CAN.markPaid);const r=findP(p.code);r.status="pending";r.method="";r.paidAt="";save(d);return r}
    case "checkin":{need(CAN.gate);const r=findP(p.code);if(!r)throw new Error("No pass found.");if(r.status==="pending")throw new Error("Payment not confirmed yet.");r.status="in";r.checkedAt=nowIso();save(d);return r}
    case "reset":need(r=>r==="admin");store.set("pm26",seed());return true
  }
  throw new Error("Unknown action");
}

    <div class="ticket-body">${gate}
      <span class="plate">${esc(r.plate)}<small>ZA</small></span>
      <span class="bay">${esc(bayOf(r.bay).name)}</span>
      <div class="who"><strong>${esc(r.title)} ${esc(r.name)}</strong><span class="muted small">${esc(r.car)} · ${esc(r.conference)}</span></div>
      <div class="qr" id="qr"></div><div class="code">${esc(r.code)}</div>
      ${!rl&&r.status==="paid"?`<div class="seal" role="img" aria-label="Paid. Enter in peace."><b>PAID</b><span>ENTER IN<br>PEACE</span></div>`:""}
      ${!rl&&r.status==="pending"?`<div class="perf" style="width:100%"></div>`+bankBlock(r.code):""}
      ${!rl&&r.status!=="pending"?`<p class="small muted">Show this QR code to the marshal at the gate.</p>`:""}
    </div><div class="perf"></div>
    <div class="ticket-body"><p class="blessing">Travel safely. God go with you on the road.</p>
      <a class="btn ghost" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent("My parking pass for the "+CONFIG.EVENT+" at "+CONFIG.HOST+": "+base()+"#pass-"+r.code)}">Save my pass to WhatsApp</a>
      <p class="small muted">Send the pass link to yourself or a family member so you can open it easily on the day.</p>
      <div class="row" style="justify-content:center"><button class="ghost" data-copy="${esc(base()+"#pass-"+r.code)}">Copy pass link</button><button class="ghost" id="rf2">Refresh status</button></div></div>
  </article>`,""));
  qr($("#qr"),base()+"#pass-"+r.code);
  $("#rf2").onclick=()=>viewPass(code);
  const ci=$("#ci");if(ci)ci.onclick=async()=>{ci.disabled=true;try{await api("checkin",{pin:pin(),code});toast("Checked in");viewPass(code)}catch(e){toast(e.message);ci.disabled=false}};

const CARD={w:1080,h:1920};
let crestImg=null;
function loadImg(src){return new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=src})}
function wrapLines(ctx,text,max){const w=String(text).split(/\s+/);const out=[];let cur="";w.forEach(x=>{const t=cur?cur+" "+x:x;if(ctx.measureText(t).width>max&&cur){out.push(cur);cur=x}else cur=t});if(cur)out.push(cur);return out}
function drawCard(ctx,d,photo,zoom,ox,oy){
  const W=CARD.w,H=CARD.h,cx=W/2,py=770,pr=280;
  /* deep royal purple field */
  let g=ctx.createLinearGradient(0,0,W,H);g.addColorStop(0,"#1f0836");g.addColorStop(.5,"#3b145c");g.addColorStop(1,"#150526");ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  /* glory behind the photo */
  g=ctx.createRadialGradient(cx,py,40,cx,py,900);g.addColorStop(0,"rgba(255,214,130,.55)");g.addColorStop(.35,"rgba(196,140,50,.18)");g.addColorStop(1,"rgba(0,0,0,0)");ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  /* rays: exceedingly, abundantly */
  ctx.save();ctx.translate(cx,py);for(let i=0;i<48;i++){ctx.rotate(Math.PI*2/48);const a=i%2?.05:.11;const rg=ctx.createLinearGradient(0,0,0,-1150);rg.addColorStop(0,`rgba(255,220,150,${a})`);rg.addColorStop(1,"rgba(255,220,150,0)");ctx.fillStyle=rg;ctx.beginPath();ctx.moveTo(-6,0);ctx.lineTo(-38,-1150);ctx.lineTo(38,-1150);ctx.lineTo(6,0);ctx.fill()}ctx.restore();
  /* concentric halo rings */
  ctx.strokeStyle="rgba(232,194,122,.28)";ctx.lineWidth=2;[pr+40,pr+80,pr+130].forEach((r,i)=>{ctx.setLineDash(i===1?[4,14]:[]);ctx.beginPath();ctx.arc(cx,py,r,0,Math.PI*2);ctx.stroke()});ctx.setLineDash([]);
  /* sparkles */
  const sp=[[150,560,5],[930,620,6],[200,1080,4],[880,1040,5],[120,820,3],[960,860,4],[300,430,3],[790,440,4]];ctx.fillStyle="#ffe7a8";sp.forEach(([x,y,r])=>{ctx.beginPath();ctx.moveTo(x,y-r*4);ctx.quadraticCurveTo(x,y,x+r*4,y);ctx.quadraticCurveTo(x,y,x,y+r*4);ctx.quadraticCurveTo(x,y,x-r*4,y);ctx.quadraticCurveTo(x,y,x,y-r*4);ctx.fill()});
  /* crest and heading */
  if(crestImg){const cw=250,ch=cw*crestImg.height/crestImg.width;ctx.drawImage(crestImg,cx-cw/2,70,cw,ch)}
  ctx.textAlign="center";ctx.fillStyle="#e8c27a";ctx.font="700 30px Cinzel";ctx.fillText("19TH EPISCOPAL DISTRICT",cx,360);
  ctx.fillStyle="rgba(255,255,255,.75)";ctx.font="600 22px Cinzel";ctx.fillText("AFRICAN METHODIST EPISCOPAL CHURCH",cx,398);
  /* photo */
  ctx.save();ctx.beginPath();ctx.arc(cx,py,pr,0,Math.PI*2);ctx.closePath();ctx.clip();
  if(photo){const s=Math.max(2*pr/photo.width,2*pr/photo.height)*zoom;const w=photo.width*s,h=photo.height*s;ctx.drawImage(photo,cx-w/2+ox,py-h/2+oy,w,h)}
  else{g=ctx.createLinearGradient(0,py-pr,0,py+pr);g.addColorStop(0,"#5a2d80");g.addColorStop(1,"#2a0f45");ctx.fillStyle=g;ctx.fillRect(cx-pr,py-pr,2*pr,2*pr);ctx.fillStyle="rgba(232,194,122,.8)";ctx.font="italic 600 40px 'Playfair Display'";ctx.fillText("Your photo here",cx,py+12)}
  ctx.restore();
  g=ctx.createLinearGradient(cx-pr,py-pr,cx+pr,py+pr);g.addColorStop(0,"#fff0c2");g.addColorStop(.35,"#d4a24c");g.addColorStop(.65,"#8a5d14");g.addColorStop(1,"#f3d38a");
  ctx.strokeStyle=g;ctx.lineWidth=16;ctx.beginPath();ctx.arc(cx,py,pr+8,0,Math.PI*2);ctx.stroke();
  ctx.strokeStyle="rgba(255,240,194,.6)";ctx.lineWidth=3;ctx.beginPath();ctx.arc(cx,py,pr+26,0,Math.PI*2);ctx.stroke();
  /* ribbon: I AM REGISTERED */
  const ry=py+pr-10,rw=560,rh=92;
  ctx.fillStyle="#7a5210";[[-1],[1]].forEach(([k])=>{ctx.beginPath();ctx.moveTo(cx+k*(rw/2-30),ry+18);ctx.lineTo(cx+k*(rw/2+70),ry+18);ctx.lineTo(cx+k*(rw/2+40),ry+18+rh/2);ctx.lineTo(cx+k*(rw/2+70),ry+18+rh);ctx.lineTo(cx+k*(rw/2-30),ry+18+rh);ctx.fill()});
  g=ctx.createLinearGradient(0,ry,0,ry+rh);g.addColorStop(0,"#f6dc98");g.addColorStop(.5,"#d4a24c");g.addColorStop(1,"#a8761f");ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(cx-rw/2,ry);ctx.lineTo(cx+rw/2,ry);ctx.lineTo(cx+rw/2,ry+rh);ctx.lineTo(cx-rw/2,ry+rh);ctx.fill();
  ctx.fillStyle="#2a0f45";ctx.font="700 46px Cinzel";ctx.fillText("I AM REGISTERED",cx,ry+rh/2+16);
  /* name */
  ctx.fillStyle="#ffffff";ctx.font="900 76px 'Playfair Display'";let y=ry+rh+110;
  const nl=wrapLines(ctx,d.name,940).slice(0,2);if(nl.length>1){ctx.font="900 64px 'Playfair Display'"}
  wrapLines(ctx,d.name,940).slice(0,2).forEach(l=>{ctx.fillText(l,cx,y);y+=nl.length>1?74:84});
  ctx.fillStyle="#d9c6ee";ctx.font="500 34px 'Public Sans'";wrapLines(ctx,d.sub,920).slice(0,2).forEach(l=>{ctx.fillText(l,cx,y+4);y+=46});
  /* divider */
  y+=26;ctx.strokeStyle="#d4a24c";ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(cx-300,y);ctx.lineTo(cx-24,y);ctx.moveTo(cx+24,y);ctx.lineTo(cx+300,y);ctx.stroke();
  ctx.fillStyle="#e8c27a";ctx.beginPath();ctx.moveTo(cx,y-12);ctx.lineTo(cx+12,y);ctx.lineTo(cx,y+12);ctx.lineTo(cx-12,y);ctx.fill();
  /* event */
  y+=70;ctx.fillStyle="#f3d38a";ctx.font="700 56px Cinzel";ctx.fillText("PLANNING MEETING 2026",cx,y);
  y+=56;ctx.fillStyle="#ffffff";ctx.font="600 34px 'Public Sans'";ctx.fillText(d.dates,cx,y);
  y+=48;ctx.fillStyle="#d9c6ee";ctx.font="500 30px 'Public Sans'";ctx.fillText(d.host,cx,y);
  /* theme band */
  const by=Math.max(y+120,1690);g=ctx.createLinearGradient(0,by,0,H);g.addColorStop(0,"rgba(0,0,0,0)");g.addColorStop(1,"rgba(0,0,0,.45)");ctx.fillStyle=g;ctx.fillRect(0,by-60,W,H-by+60);
  ctx.fillStyle="#f3d38a";ctx.font="italic 700 58px 'Playfair Display'";ctx.fillText("Reviving the Connection",cx,by+20);
  ctx.fillStyle="#ffffff";ctx.font="italic 600 32px 'Playfair Display'";ctx.fillText("Exceedingly, abundantly above all we can ask or think",cx,by+76);
  ctx.fillStyle="#e8c27a";ctx.font="600 24px Cinzel";ctx.fillText("EPHESIANS 3:20 TO 21",cx,by+122);
  ctx.fillStyle="rgba(255,255,255,.45)";ctx.font="500 20px 'JetBrains Mono'";ctx.fillText(d.code,cx,Math.min(by+178,H-30));
}
async function viewCard(code){
  let r;try{r=await api("getReg",{code})}catch(e){app(shell(`<section class="panel"><h2>Not found</h2><p class="muted">${esc(e.message)}</p></section>`,""));return}
  const title=r.title||(r.type==="Clergy"?"Rev.":"");
  const d={name:[title,r.names,r.surname].filter(Boolean).join(" "),sub:[r.designation,r.church].filter(Boolean).join(" · "),dates:CONFIG.DATES,host:CONFIG.HOST+(CONFIG.HOST_PLACE?", "+CONFIG.HOST_PLACE:""),code:"Registration "+r.code};
  app(shell(`<section class="panel"><h2>Your status card</h2><p class="small muted">Choose a photo, move it into place, then share it to your WhatsApp status. Your photo stays on your phone.</p>
    <canvas id="cv" width="${CARD.w}" height="${CARD.h}" style="width:100%;max-width:360px;align-self:center;border-radius:14px;touch-action:none;cursor:grab"></canvas>
    <div class="row"><label class="btn brass" style="flex:1;text-align:center">Take a selfie<input type="file" id="phs" accept="image/*" capture="user" hidden></label><label class="btn ghost" style="flex:1;text-align:center">Choose a photo<input type="file" id="ph" accept="image/*" hidden></label></div>
    <label for="zm" class="small">Zoom<input type="range" id="zm" min="1" max="3" step="0.01" value="1"></label>
    <p class="small muted" id="hint">Drag the photo on the card to move it.</p>
    <div class="row"><button id="shr" class="brass" style="flex:1">Share to WhatsApp</button><button id="sav" class="ghost" style="flex:1">Save image</button></div>
    <a class="btn ghost" href="#ticket-${esc(code)}">Back to my ticket</a></section>`,""));
  const cv=$("#cv"),ctx=cv.getContext("2d");let photo=null,zoom=1,ox=0,oy=0;
  try{await Promise.all(["900 76px 'Playfair Display'","italic 700 58px 'Playfair Display'","italic 600 32px 'Playfair Display'","700 56px Cinzel","600 24px Cinzel","600 34px 'Public Sans'","500 20px 'JetBrains Mono'"].map(f=>document.fonts.load(f)))}catch(e){}
  if(!crestImg){try{crestImg=await loadImg("crest.png")}catch(e){}}
  const paint=()=>drawCard(ctx,d,photo,zoom,ox,oy);paint();
  const KEY="pm_photo_"+r.code;
  const keep=()=>{try{const c=document.createElement("canvas"),k=Math.min(1,900/Math.max(photo.width,photo.height));c.width=photo.width*k;c.height=photo.height*k;c.getContext("2d").drawImage(photo,0,0,c.width,c.height);localStorage.setItem(KEY,JSON.stringify({src:c.toDataURL("image/jpeg",.85),zoom,ox:ox/k,oy:oy/k,k}))}catch(e){}};
  try{const sv=JSON.parse(localStorage.getItem(KEY)||"null");if(sv){photo=await loadImg(sv.src);zoom=sv.zoom||1;ox=(sv.ox||0)*(sv.k||1);oy=(sv.oy||0)*(sv.k||1);$("#zm").value=zoom;paint();$("#hint").textContent="Your last photo is here. Take a new selfie or choose another photo any time."}}catch(e){}
  const pick=async e=>{const f=e.target.files[0];e.target.value="";if(!f)return;photo=await loadImg(URL.createObjectURL(f));zoom=1;ox=0;oy=0;$("#zm").value=1;paint();keep()};
  $("#ph").onchange=pick;$("#phs").onchange=pick;
  $("#zm").oninput=e=>{zoom=+e.target.value;paint()};$("#zm").onchange=()=>{if(photo)keep()};
  let drag=null;cv.onpointerdown=e=>{if(!photo)return;drag={x:e.clientX,y:e.clientY,ox,oy};cv.setPointerCapture(e.pointerId)};
  cv.onpointermove=e=>{if(!drag)return;const k=CARD.w/cv.getBoundingClientRect().width;ox=drag.ox+(e.clientX-drag.x)*k;oy=drag.oy+(e.clientY-drag.y)*k;paint()};
  cv.onpointerup=()=>{if(drag)keep();drag=null};
  const blob=()=>new Promise(ok=>cv.toBlob(ok,"image/jpeg",.92));
  const fname="Planning-Meeting-2026-"+r.code+".jpg";
  const save=async()=>{const b=await blob();const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=fname;document.body.appendChild(a);a.click();a.remove()};
  $("#sav").onclick=save;
  $("#shr").onclick=async()=>{if(!photo&&!confirm("You have not added your photo yet. Share the card without it?"))return;
    const b=await blob(),f=new File([b],fname,{type:"image/jpeg"});
    if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],text:"I am registered for the 19th Episcopal District Planning Meeting, "+CONFIG.DATES+". See you at Ebenezer."})}catch(e){}}
    else{await save();toast("Card saved. Open WhatsApp, tap Status, and choose it from your photos.")}};
}

function viewFind(){
  app(shell(`<section class="panel"><h2>Find my registration</h2>
    <form id="f1" novalidate><div class="grid2"><label for="fs">Surname<input id="fs"></label><label for="fm">Mobile<input id="fm" inputmode="tel"></label></div><p id="e1" class="err" hidden></p><button type="submit">Show my ticket</button></form></section>
  <section class="panel"><h2>Find my parking pass</h2>
    <form id="f2" novalidate><div class="grid2"><label for="fp">Car registration<input id="fp" class="plate-in" autocomplete="off"></label><label for="fl">Last four digits of your number<input id="fl" inputmode="numeric" maxlength="4"></label></div><p id="e2" class="err" hidden></p><button type="submit">Show my pass</button></form></section>`,"find"));
  $("#f1").onsubmit=async e=>{e.preventDefault();try{const r=await api("findReg",{surname:$("#fs").value,mobile:$("#fm").value});location.hash="ticket-"+r.code}catch(x){$("#e1").textContent=x.message;$("#e1").hidden=false}};
  $("#f2").onsubmit=async e=>{e.preventDefault();try{const r=await api("findPass",{plate:$("#fp").value,last4:$("#fl").value.trim()});location.hash="pass-"+r.code}catch(x){$("#e2").textContent=x.message;$("#e2").hidden=false}};
}

/* ============ TEAM ============ */
function viewTeam(){
  app(shell(`<section class="panel"><h2>Team login</h2><p class="small muted">For the registration team, the Ebenezer host team and gate marshals. Each team sees only its own room.</p>
    <form id="lf" novalidate><label for="pin">Team PIN<input id="pin" type="password" inputmode="numeric" autocomplete="off"></label><p id="le" class="err" hidden></p><button type="submit">Sign in</button></form></section>`,"team"));
  $("#lf").onsubmit=async e=>{e.preventDefault();const p=$("#pin").value.trim();try{const r=await api("auth",{pin:p});sess.set("pm_pin",p);sess.set("pm_role",r.role);toast("Signed in as "+ROLE_NAME[r.role]);location.hash=CAN.regDesk(r.role)&&r.role!=="admin"?"regdesk":CAN.parkDesk(r.role)?"parkdesk":"gate"}catch(x){$("#le").textContent=x.message;$("#le").hidden=false}};
}
function bars(obj){const l=Object.entries(obj).sort((a,b)=>b[1]-a[1]);const m=l.length?l[0][1]:1;return l.map(([k,n])=>`<div class="bar"><span>${esc(k)}</span><div class="track"><i style="width:${Math.round(n/m*100)}%"></i></div><span>${n}</span></div>`).join("")||'<p class="muted small">None yet.</p>'}
const countMulti=(arr,f)=>arr.reduce((o,x)=>{const ks=String(x[f]||"").split(",").map(t=>t.trim()).filter(t=>t&&t!=="None");(ks.length?ks:["None"]).forEach(k=>o[k]=(o[k]||0)+1);return o},{});
const count=(arr,f)=>arr.reduce((o,x)=>{const k=x[f]||"Not given";o[k]=(o[k]||0)+1;return o},{});
let rq="",rt="all";
async function viewRegDesk(){
  if(!CAN.regDesk(role())){location.hash=role()?"home":"team";return}
  let all;try{all=await api("regList",{pin:pin()})}catch(e){toast(e.message);return}
  let rows=all.slice();if(rt!=="all")rows=rows.filter(x=>x.type===rt);
  if(rq){const q=rq.toLowerCase();rows=rows.filter(x=>(x.surname+x.names+x.church+x.conference+x.code+x.email).toLowerCase().includes(q))}
  rows.sort((a,b)=>b.created.localeCompare(a.created));
  const t=count(all,"type");
  app(shell(`<section class="kpis"><div class="kpi"><span>Registered</span><b>${all.length}</b></div><div class="kpi"><span>Delegates</span><b>${t.Delegate||0}</b></div><div class="kpi"><span>Clergy</span><b>${t.Clergy||0}</b></div><div class="kpi"><span>Observers</span><b>${t.Observer||0}</b></div></section>
  ${all.some(x=>x.sample)?`<p class="note demo small">Rows marked <span class="tag">Sample</span> show how the desk works.</p>`:""}
  <section class="panel"><div class="row" style="justify-content:space-between"><h2>Registrations</h2><div class="row"><button class="ghost" id="csv">Download for Excel</button><button class="ghost" id="rl">Refresh</button></div></div>
    <div class="row"><select id="ft" style="width:auto"><option value="all">All types</option><option>Delegate</option><option>Clergy</option><option>Observer</option></select><input id="q" placeholder="Search name, church, conference" style="flex:1;min-width:160px" value="${esc(rq)}"></div>
    <div class="tbl-wrap"><table><thead><tr><th>Code</th><th>Name</th><th>Contact</th><th>Church and district</th><th>Conference</th><th>Designation</th><th>Auxiliary</th><th>Type</th><th></th></tr></thead><tbody>
    ${rows.map(x=>`<tr><td class="mono"><a href="#ticket-${esc(x.code)}" style="color:inherit">${esc(x.code)}</a></td><td>${x.title?esc(x.title)+" ":""}${esc(x.surname)}, ${esc(x.names)}${x.sample?' <span class="tag">Sample</span>':""}</td><td>${esc(x.mobile)}<br><span class="muted small">${esc(x.email)}</span></td><td>${esc(x.church)}<br><span class="muted small">${esc(x.district)}</span></td><td>${esc(x.conference)}</td><td>${esc(x.designation)}</td><td>${esc(x.auxiliary)}</td><td>${esc(x.type)}</td><td>${canEdit()?`<a class="btn ghost" style="padding:6px 10px;font-size:13px" href="#deskedit-${esc(x.code)}">Edit</a>`:""}</td></tr>`).join("")||'<tr><td colspan="8" class="muted">No registrations match.</td></tr>'}
    </tbody></table></div></section>
  <div class="grid2"><section class="panel"><h3>By conference</h3><div class="bars">${bars(count(all,"conference"))}</div></section><section class="panel"><h3>By auxiliary</h3><div class="bars">${bars(countMulti(all,"auxiliary"))}</div></section></div>
  ${!LIVE&&role()==="admin"?'<div class="row"><button class="ghost" id="rs">Reset preview data</button></div>':""}`,"regdesk",true));
  $("#ft").value=rt;$("#ft").onchange=e=>{rt=e.target.value;viewRegDesk()};$("#q").onchange=e=>{rq=e.target.value;viewRegDesk()};$("#rl").onclick=viewRegDesk;
  $("#csv").onclick=()=>dlCsv("Planning_Meeting_2026_Registrations.csv",[["Code","Title","Surname","Names","Email","Mobile","Church","District","Conference","Designation","Auxiliary","Registration type","Consent","Registered at","Corrected at"]].concat(all.map(x=>[x.code,x.title||"",x.surname,x.names,x.email,x.mobile,x.church,x.district,x.conference,x.designation,x.auxiliary,x.type,x.consent?"Yes":"No",x.created,x.edited||""])));
  const rs=$("#rs");if(rs)rs.onclick=async()=>{await api("reset",{pin:pin()});toast("Preview data reset");viewRegDesk()};
}
let pf="all",pq="";
async function viewParkDesk(){
  if(!CAN.parkDesk(role())){location.hash=role()?"home":"team";return}
  let all;try{all=await api("parkList",{pin:pin()})}catch(e){toast(e.message);return}
  const paid=all.filter(x=>x.status!=="pending"),pend=all.filter(x=>x.status==="pending"),inn=all.filter(x=>x.status==="in");
  let rows=all.slice();if(pf!=="all")rows=rows.filter(x=>x.status===pf);
  if(pq){const q=pq.toLowerCase();rows=rows.filter(x=>(x.name+x.plate+x.code+x.conference).toLowerCase().includes(q))}
  rows.sort((a,b)=>(a.status==="pending"?0:1)-(b.status==="pending"?0:1)||b.created.localeCompare(a.created));
  const byM=m=>paid.filter(x=>(x.method||"EFT")===m).length*CONFIG.PARK_FEE;
  const byBay={};CONFIG.BAYS.forEach(b=>byBay[b.name]=all.filter(x=>x.bay===b.id).length);
  app(shell(`<section class="kpis"><div class="kpi"><span>Collected</span><b>${R(paid.length*CONFIG.PARK_FEE)}</b></div><div class="kpi"><span>Still owed</span><b>${R(pend.length*CONFIG.PARK_FEE)}</b></div><div class="kpi"><span>Cars booked</span><b>${all.length}</b></div><div class="kpi"><span>Parked now</span><b>${inn.length}</b></div></section>
  ${all.some(x=>x.sample)?`<p class="note demo small">Rows marked <span class="tag">Sample</span> show how the desk works.</p>`:""}
  <section class="panel"><div class="row" style="justify-content:space-between"><h2>Parking bookings</h2><div class="row"><button class="ghost" id="csv">Download for Excel</button><button class="ghost" id="rl">Refresh</button></div></div>
    <div class="row"><select id="flt" style="width:auto"><option value="all">All</option><option value="pending">Awaiting payment</option><option value="paid">Paid, not arrived</option><option value="in">Parked</option></select><input id="q" placeholder="Search name, plate, code" style="flex:1;min-width:160px" value="${esc(pq)}"></div>
    <div class="tbl-wrap"><table><thead><tr><th>Code</th><th>Name</th><th>Registration</th><th>Bay</th><th>Status</th><th>Action</th></tr></thead><tbody>
    ${rows.map(x=>`<tr><td class="mono"><a href="#pass-${esc(x.code)}" style="color:inherit">${esc(x.code)}</a></td><td>${esc(x.title)} ${esc(x.name)}${x.sample?' <span class="tag">Sample</span>':""}${x.bay==="P"?(onListName(x.name)?' <span class="tag">On clergy list</span>':' <span class="tag" style="background:var(--warn-soft)">Check clergy</span>'):""}<br><span class="muted small">${esc(x.phone)}</span></td><td class="mono">${esc(x.plate)}<br><span class="muted small" style="font-family:var(--f-body)">${esc(x.car)}</span></td><td>${esc(bayOf(x.bay).short)}</td><td>${chip(x.status)}${x.method?`<br><span class="muted small">${esc(x.method)}</span>`:""}</td><td>${x.status==="pending"?`<button class="okb" data-paid="${esc(x.code)}">EFT received</button>`:x.status==="paid"?`<button class="ghost" data-undo="${esc(x.code)}">Undo paid</button>`:""}</td></tr>`).join("")||'<tr><td colspan="6" class="muted">No bookings match.</td></tr>'}
    </tbody></table></div></section>
  <div class="grid2"><section class="panel"><h3>Money by method</h3><div class="bars">${["EFT","Cash","Card"].map(m=>`<div class="bar"><span>${m}</span><div class="track"><i style="width:${paid.length?Math.round(byM(m)/(paid.length*CONFIG.PARK_FEE)*100):0}%"></i></div><span>${R(byM(m))}</span></div>`).join("")}</div></section><section class="panel"><h3>Cars by bay</h3><div class="bars">${bars(byBay)}</div></section></div>`,"parkdesk",true));
  $("#flt").value=pf;$("#flt").onchange=e=>{pf=e.target.value;viewParkDesk()};$("#q").onchange=e=>{pq=e.target.value;viewParkDesk()};$("#rl").onclick=viewParkDesk;
  document.querySelectorAll("[data-paid]").forEach(b=>b.onclick=async()=>{b.disabled=true;try{await api("markPaid",{pin:pin(),code:b.dataset.paid,method:"EFT"});toast("Marked paid. The pass is now green.");viewParkDesk()}catch(e){toast(e.message)}});
  document.querySelectorAll("[data-undo]").forEach(b=>b.onclick=async()=>{try{await api("unpay",{pin:pin(),code:b.dataset.undo});viewParkDesk()}catch(e){toast(e.message)}});
  $("#csv").onclick=()=>dlCsv("Planning_Meeting_2026_Parking.csv",[["Code","Title","Name","Phone","Conference","Registration","Car","Bay","Status","Method","Paid at","Checked in at","Source"]].concat(all.map(x=>[x.code,x.title,x.name,x.phone,x.conference,x.plate,x.car,bayOf(x.bay).name,x.status,x.method,x.paidAt,x.checkedAt,x.source])));
}
async function viewGate(){
  if(!CAN.gate(role())){location.hash=role()?"home":"team";return}
  app(shell(`<section class="panel"><h2>Gate check</h2><p class="small muted">Scan the driver's QR code with this phone's camera and the pass opens with a check in button. No QR? Type the registration.</p>
    <form id="gf" novalidate><label for="gq">Registration or pass code<input id="gq" class="plate-in" autocomplete="off"></label><button type="submit">Look up</button></form><div id="gres"></div></section>
  <section class="panel"><h2>Walk in at the gate</h2><p class="small muted">Driver did not book? Take ${R(CONFIG.PARK_FEE)} and issue a pass here.</p>
    <form id="wf" novalidate><div class="grid2"><label for="wn">Title and full name<input id="wn"></label><label for="wp">WhatsApp number<input id="wp" inputmode="tel"></label></div>
      <div class="grid2"><label for="wr">Registration<input id="wr" class="plate-in" autocomplete="off"></label><label for="wm">Paid by<select id="wm"><option>Cash</option><option>Card</option><option>EFT</option></select></label></div>
      <label class="check" for="wc"><input type="checkbox" id="wc"> <span>Bishop, Presiding Elder or Pastor (Bay 1)</span></label>
      <p id="we" class="err" hidden></p><button type="submit" class="okb">Issue pass and check in</button></form></section>`,"gate"));
  $("#gf").onsubmit=async e=>{e.preventDefault();const q=$("#gq").value.trim();if(!q)return;try{const all=await api("parkList",{pin:pin()});const nq=normPlate(q),srt=s=>s.split("").sort().join(""),num=s=>(s.match(/\d+/g)||[]).join("");
    let m=all.filter(x=>x.code===q.toUpperCase()||normPlate(x.plate)===nq),close=false;
    if(!m.length&&nq.length>=4){close=true;m=all.filter(x=>{const p=normPlate(x.plate);return srt(p)===srt(nq)||p.includes(nq)||nq.includes(p)||(num(nq).length>=2&&num(p)===num(nq))})}
    const link=x=>`<a href="#pass-${esc(x.code)}" class="btn ghost" style="width:100%;margin-top:10px;text-align:left">${esc(x.plate)} · ${esc(x.title)} ${esc(x.name)} · ${esc(bayOf(x.bay).short)} ${chip(x.status)}</a>`;
    $("#gres").innerHTML=m.length?(close?`<p class="small muted" style="margin-top:10px">No exact match for ${esc(q.toUpperCase())}. Did you mean one of these? Check the plate on the car.</p>`:"")+m.map(link).join(""):`<p class="err" style="margin-top:10px">No booking for ${esc(q.toUpperCase())}. Use Walk in below.</p>`}catch(x){toast(x.message)}};
  $("#wf").onsubmit=async e=>{e.preventDefault();const v=id=>$("#"+id).value.trim();const er=$("#we");if(!v("wn")||!v("wr")){er.textContent="Name and registration are needed.";er.hidden=false;return}
    try{const parts=v("wn").split(" ");const t=["Rev.","Sis.","Bro.","Dr.","Mother","Bishop"].includes(parts[0])?parts.shift():"";
      const r=await api("book",{pin:pin(),walkin:true,method:v("wm"),title:t,name:parts.join(" "),phone:v("wp"),conference:"Walk in",plate:v("wr"),car:"",clergy:$("#wc").checked});
      await api("checkin",{pin:pin(),code:r.code});toast("Pass issued and checked in");location.hash="pass-"+r.code}catch(x){er.textContent=x.message;er.hidden=false}};
}

/* ============ ROUTER ============ */
function route(){
  const h=(location.hash||"").slice(1);
  if(h==="logout"){sess.del("pm_pin");sess.del("pm_role");toast("Signed out");location.hash="home";return}
  if(h.startsWith("ticket-"))return viewTicket(h.slice(7));
  if(h.startsWith("card-"))return viewCard(h.slice(5));
  if(h.startsWith("edit-"))return viewEdit(h.slice(5),false);
  if(h.startsWith("deskedit-"))return viewEdit(h.slice(9),true);
  if(h.startsWith("pass-"))return viewPass(h.slice(5));
  if(h.startsWith("parking-"))return viewParking(h.slice(8));
  const m={register:viewRegister,parking:()=>viewParking(),worship:viewWorship,find:viewFind,team:viewTeam,regdesk:viewRegDesk,parkdesk:viewParkDesk,gate:viewGate};
  return (m[h]||viewHome)();
}
window.addEventListener("hashchange",()=>{route();window.scrollTo(0,0)});
route();
</script>
</body>
</html>
