<html lang="en">
<head>

<style>

  --navy:#3b145c;--royal:#2a0b45;--brass:#c79a3a;--gold-hi:#f3d38a;--brass-soft:#f8eed6;

  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;

}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12061e;--surface:#1e0d31;--ink:#f3edf9;--muted:#b6a5cb;--line:#372350;--navy:#5d2a8a;--royal:#1a0730;--brass:#e0b65a;--brass-soft:#2f2212;
  --ok:#5fcf95;--ok-soft:#163326;--warn:#f0b74f;--warn-soft:#33280f;--bad:#f08a82;--bad-soft:#3a1c1a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12061e;--surface:#1e0d31;--ink:#f3edf9;--muted:#b6a5cb;--line:#372350;--navy:#5d2a8a;--royal:#1a0730;--brass:#e0b65a;--brass-soft:#2f2212;
  --ok:#5fcf95;--ok-soft:#163326;--warn:#f0b74f;--warn-soft:#33280f;--bad:#f08a82;--bad-soft:#3a1c1a;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:580px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:18px}
.wide{max-width:1000px}
.hero{color:#fff;border-radius:20px;padding:26px 20px 22px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;position:relative;overflow:hidden;isolation:isolate;
  background:radial-gradient(120% 80% at 50% 0%,rgba(255,214,130,.38),rgba(196,140,50,.08) 45%,transparent 70%),linear-gradient(160deg,#2a0b45,#4a1a6e 55%,#1a0730);border:1px solid rgba(232,194,122,.35)}
.hero::before{content:"";position:absolute;inset:-60%;z-index:-1;background:repeating-conic-gradient(from 0deg at 50% 18%,rgba(255,224,160,.10) 0deg 4deg,transparent 4deg 11deg);animation:spin 90s linear infinite}

@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.hero::before,.tk-rays{animation:none}}
.hero .crest{width:92px;height:auto;filter:drop-shadow(0 6px 18px rgba(0,0,0,.35))}
.hero h1{background:linear-gradient(180deg,#fff7df,#f3d38a 55%,#c79a3a);-webkit-background-clip:text;background-clip:text;color:transparent}
.eyebrow{font-family:var(--f-cap);font-weight:700;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#e8c27a}
h1{font-family:var(--f-display);font-weight:900;font-size:clamp(30px,8vw,42px);line-height:1.05;margin:0}
h2{font-family:var(--f-display);font-weight:700;font-size:22px;margin:0}
h3{font-family:var(--f-display);font-weight:700;font-size:18px;margin:0}
p{margin:0}
.muted{color:var(--muted)}.small{font-size:13px}
.prog{display:flex;flex-direction:column;gap:10px}.prog-row{display:flex;flex-direction:column;gap:2px;padding-left:12px;border-left:3px solid var(--brass)}.prog-row span{color:var(--muted);font-size:14px}
.hero .facts{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:8px}
.hero .fact{border:1px solid rgba(232,194,122,.55);background:rgba(0,0,0,.18);border-radius:999px;padding:4px 12px;font-size:13px;color:#fff3d6}
nav.tabs{display:flex;gap:6px;flex-wrap:wrap}

nav.tabs a[aria-current="page"]{background:var(--navy);color:#fff;border-color:var(--brass);font-weight:600}
.panel{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--brass);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px}
form{display:flex;flex-direction:column;gap:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid2>*{min-width:0}
@media (max-width:460px){.grid2{grid-template-columns:1fr}}
label{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600}
.hint{font-weight:400;color:var(--muted)}
input,select{font:inherit;font-weight:400;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:10px 12px;width:100%}

.plate-in{font-family:var(--f-mono);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.check{flex-direction:row;align-items:flex-start;gap:10px;font-weight:400}.check input{width:auto;margin-top:3px}
.types{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

button,.btn{font:inherit;font-weight:600;border:0;border-radius:10px;padding:12px 16px;cursor:pointer;background:linear-gradient(180deg,#4a1a6e,#2a0b45);color:#fff;box-shadow:inset 0 0 0 1px rgba(232,194,122,.35);text-align:center;text-decoration:none;display:inline-block}

.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.room b{font-family:var(--f-display);font-size:17px}

.room .ic{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#5d2a8a,#2a0b45);color:#f3d38a;box-shadow:0 0 0 2px #c79a3a}
.room .ic svg{width:22px;height:22px}
.ticket{background:var(--surface);border:1px solid rgba(199,154,58,.55);border-radius:18px;overflow:hidden;box-shadow:0 10px 30px rgba(42,11,69,.18)}
.ticket-head{position:relative;overflow:hidden;isolation:isolate;background:radial-gradient(90% 120% at 15% 0%,rgba(255,214,130,.35),transparent 60%),linear-gradient(150deg,#2a0b45,#4a1a6e 60%,#1a0730);color:#fff;padding:18px;display:flex;justify-content:space-between;gap:12px;align-items:flex-start;border-bottom:3px solid #c79a3a}

.ticket-body{padding:18px;display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center}
.perf{border-top:2px dashed var(--line);margin:0 14px}

.qr{background:#fff;padding:12px;border-radius:14px;display:inline-block;border:3px solid transparent;background:linear-gradient(#fff,#fff) padding-box,linear-gradient(135deg,#fff0c2,#d4a24c 40%,#8a5d14 70%,#f3d38a) border-box;box-shadow:0 0 0 6px rgba(199,154,58,.15),0 0 34px rgba(212,162,76,.35)}
.code{font-family:var(--f-mono);font-weight:700;font-size:22px;letter-spacing:.18em;color:var(--navy)}
.who strong{font-family:var(--f-display);font-size:18px;display:block}
.status{font-family:var(--f-mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;padding:6px 12px;border-radius:999px;display:inline-block}
.st-pending{background:var(--warn-soft);color:var(--warn)}.st-reg{background:linear-gradient(180deg,#f6dc98,#d4a24c);color:#2a0b45}.st-paid{background:var(--ok-soft);color:var(--ok)}.st-in{background:var(--brass-soft);color:var(--ink)}
.bay{font-family:var(--f-display);font-weight:700;font-size:19px;border:2px solid var(--brass);background:var(--brass-soft);color:var(--ink);border-radius:12px;padding:8px 16px}

.verdict{width:100%;border-radius:12px;padding:16px;font-family:var(--f-display);font-size:22px;font-weight:700}
.v-ok{background:var(--ok-soft);color:var(--ok)}.v-warn{background:var(--warn-soft);color:var(--warn)}.v-in{background:var(--brass-soft)}
.pay{width:100%;text-align:left;display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px;margin:0}
.pay dt{color:var(--muted)}.pay dd{margin:0;font-weight:600;overflow-wrap:anywhere}.mono{font-family:var(--f-mono)}
.bays{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bayc{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:4px}
.bayc b{font-family:var(--f-display);font-size:22px}
.bayc span{font-size:12px;color:var(--muted)}
.meter{height:8px;border-radius:5px;background:var(--line);overflow:hidden}.meter i{display:block;height:100%;background:linear-gradient(90deg,#c79a3a,#f3d38a)}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
button.kpi{background:var(--surface)!important;color:var(--ink);box-shadow:none;font-weight:400;border:1px solid var(--line);border-left:4px solid var(--brass);padding:12px}
.kpi.on{border-color:var(--brass);background:var(--brass-soft)}
.kpi{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--brass);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column}
.kpi span{font-size:12px;color:var(--muted)}.kpi b{font-family:var(--f-display);font-size:24px;font-variant-numeric:tabular-nums}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:760px}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--bg)}
td button{padding:6px 10px;font-size:12px;border-radius:7px}
.tag{font-size:10px;font-family:var(--f-mono);text-transform:uppercase;letter-spacing:.08em;padding:2px 6px;border-radius:5px;background:var(--brass-soft);color:var(--ink)}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:minmax(0,1.2fr) 2fr auto;gap:10px;align-items:center;font-size:13px}
.bar .track{height:8px;background:var(--line);border-radius:5px;overflow:hidden}.bar .track i{display:block;height:100%;background:var(--navy)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:20}
.dslots{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.dslot{border:1px dashed var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:2px;font-size:13px;color:var(--muted)}
.dslot b{color:var(--ink);font-size:14px}.dslot .dmark{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:13px}
.dslot.on{border:1px solid var(--brass);background:var(--brass-soft);color:var(--ink)}.dslot.on .dmark{background:linear-gradient(180deg,#f6dc98,#c79a3a);border-color:#c79a3a;color:#2a0b45;font-weight:700}
.deleg.done{border-top-color:var(--ok)}
.btn.wa{background:#1f7a4d!important;box-shadow:none;color:#fff}
.feebox{width:100%;display:flex;justify-content:space-between;align-items:center;gap:12px;border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-align:left}.feebox b{display:block;font-family:var(--f-display);font-size:24px}
.feebox.paid{border-color:var(--ok)}
.pop{position:fixed;inset:0;background:rgba(18,6,30,.7);display:flex;align-items:center;justify-content:center;padding:16px;z-index:30}
.popc{background:var(--surface);border-radius:18px;border-top:4px solid var(--brass);max-width:440px;width:100%;max-height:90vh;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:12px}
.popc .panel{border:0;padding:0}
.live{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;text-align:center}.live b{display:block;font-family:var(--f-display);font-size:30px;line-height:1.1;color:var(--navy)}.live span{font-size:12px;color:var(--muted)}
.lhead{font-family:var(--f-cap);font-weight:700;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--brass);margin-top:6px;border-top:1px solid var(--line);padding-top:12px}
.lgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.lstat{border:1px solid var(--line);border-radius:12px;padding:10px}.lstat b{display:block;font-family:var(--f-display);font-size:26px;color:var(--navy);line-height:1.1}.lstat span{font-size:12px;color:var(--muted)}.lstat em{font-style:normal}
.rank{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}.rank li{display:flex;gap:10px;align-items:center}.rank li div{display:flex;flex-direction:column}.rank li span:not(.medal){font-size:12px;color:var(--muted)}
.medal{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px}
.ltbl td{vertical-align:top}.ltbl .yes{color:var(--ok);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chipb{background:var(--surface)!important;color:var(--ink)!important;border:1px solid var(--line)!important;box-shadow:none!important;border-radius:999px;padding:8px 14px;font-weight:500}

.ask{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:17px;border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--brass-soft)}.ask b{font-family:var(--f-display);font-size:19px;color:var(--navy)}
.sumbar{display:flex;flex-wrap:wrap;gap:8px}.sumbar div{flex:1 1 120px;border:1px solid var(--line);border-left:4px solid var(--brass);border-radius:12px;padding:10px 12px}.sumbar b{display:block;font-family:var(--f-display);font-size:24px;color:var(--navy)}.sumbar span{font-size:12px;color:var(--muted)}
body.ddark{background:#12061e}body.ddark #app~*{color:#b6a5cb}
.invb{background:linear-gradient(180deg,#4a1a6e,#2a0b45)!important;text-align:center}
.dash{position:relative;min-height:100vh;background:radial-gradient(120% 60% at 50% 0%,#4a1a6e 0%,#2a0b45 45%,#12061e 100%);color:#f3edf9;overflow:hidden;isolation:isolate;padding:0 max(16px,env(safe-area-inset-left)) 40px}

.dstars{position:absolute;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}
.dtop{max-width:1180px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 0;flex-wrap:wrap}.dback{color:#f3d38a;text-decoration:none;font-family:var(--f-cap);font-weight:700;letter-spacing:.08em}
.dbtn{background:rgba(0,0,0,.25)!important;color:#fff3d6!important;border:1px solid rgba(232,194,122,.5)!important;box-shadow:none!important}
.dhero{text-align:center;max-width:900px;margin:10px auto 22px}.dhero h1{font-family:var(--f-display);font-weight:900;font-size:clamp(34px,7vw,72px);line-height:1;margin:8px 0;background:linear-gradient(180deg,#fff7df,#f3d38a 55%,#c79a3a);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 8px 30px rgba(212,162,76,.35))}

.banner{display:grid;grid-template-columns:150px minmax(0,1fr) 40px;gap:10px;align-items:center;margin:8px 0;font-size:14px}.banner div{height:12px;border-radius:6px;background:rgba(255,255,255,.08);overflow:hidden}.banner i{display:block;height:100%;background:linear-gradient(90deg,#a8761f,#f3d38a);border-radius:6px}.banner b{color:#f3d38a;text-align:right}

</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast" hidden></div>
<script>
/* ============ SETTINGS ============ */
const CONFIG={
  API_URL:"https://script.google.com/macros/s/AKfycbzEC7iKmpth4-49of8HKGMdwk__d1zkV6y9cEUZESVeUu-_bNqoIkCc_VPC1dhYlgvC/exec",
  SITE_URL:"",
  EVENT:"19th Episcopal District Christian Education Congress and Planning Meeting",
  APP:"Planning Meeting 2026",
  HOST:"Ebenezer AME Church",
  HOST_PLACE:"Atteridgeville",
  DATES:"2 to 6 December 2026",
  PROGRAMME:[
    {day:"Wednesday 2 December",what:"19th Episcopal District Women's Missionary Society Convention"},
    {day:"Thursday 3 to Sunday 6 December",what:"Christian Education Congress and Planning Meeting, closing on Sunday"}
  ],
  THEME:"Reviving the Connection: Exceedingly, Abundantly Above All We Can Ask or Think",
  EDIT_LIVE:true,        // turn on once the Apps Script has updateReg and fixReg
  REG_FEE:650,           // registration fee in rand per person; 0 = no fee
  REG_BANK:null,         // fill in when the Bishop's office gives the account, e.g. {bank:"",accountName:"",accountNumber:"",branchCode:""}
  DELEG_LIVE:false,      // turn on once the Apps Script saves the church role, fee and church key
  PARK_FEE:50,
  BAYS:[
    {id:"P",name:"Bay 1 · Bishops, Presiding Elders and Pastors",short:"Clergy bay",cap:0,clergy:true},
    {id:"A",name:"Bay 2 · General",short:"General bay",cap:80},
    {id:"B",name:"Bay 3 · General",short:"Second general bay",cap:30}
  ],
  BANK:{bank:"Standard Bank",accountName:"Ebenezer AME Church",accountNumber:"10290264284",branchCode:"051001"},
  CONTACT:{name:"Aggy Mokone",phone:"072 192 9010"},
  WORSHIP_URL:"",        // later: link or embed of the order of worship
  DEMO_PINS:{admin:"1111",registration:"2222",ebenezer:"3333",marshal:"4444"}
};
const LIVE=!!CONFIG.API_URL;
const ROLE_NAME={admin:"Organiser",registration:"Registration team",ebenezer:"Ebenezer host team",marshal:"Gate marshal"};
const CAN={
  regDesk:r=>r==="admin"||r==="registration",
  parkDesk:r=>r==="admin"||r==="ebenezer",
  gate:r=>r==="admin"||r==="ebenezer"||r==="marshal",
  markPaid:r=>r==="admin"||r==="ebenezer",
  docs:r=>r==="admin"||r==="registration"
};

/* ============ STORAGE ============ */
const mem={};
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return k in mem?mem[k]:d}},set(k,v){mem[k]=v;try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const sess={get(k){try{return sessionStorage.getItem(k)}catch(e){return mem["s_"+k]||null}},set(k,v){mem["s_"+k]=v;try{sessionStorage.setItem(k,v)}catch(e){}},del(k){delete mem["s_"+k];try{sessionStorage.removeItem(k)}catch(e){}}};
const nowIso=()=>new Date().toISOString();
const normPlate=s=>String(s||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
const digits=s=>String(s||"").replace(/\D/g,"");
function mkCode(p){const a="ACDEFHJKMNPRTUVWXY3479";let s=p;for(let i=0;i<4;i++)s+=a[Math.floor(Math.random()*a.length)];return s}

/* ============ DEMO DATA ============ */
function seed(){
  const regs=[
    ["Molefe","Thabo","Vaal Conference","Clergy","Pastor","Lay Organization"],
    ["Dlamini","Nomsa","M.M. Mokone Memorial Conference","Delegate","Steward","WMS"],
    ["Seleka","Kagiso","M.M. Mokone Memorial Conference","Delegate","Class Leader","Sons of Allen"],
    ["Mokoena","Lerato","Free State Conference","Clergy","Presiding Elder","None"],
    ["Nkosi","Palesa","Vaal Conference","Observer","Member","ACE League"]
  ].map((r,i)=>({code:"PMSMP"+(i+1),created:nowIso(),surname:r[0],names:r[1],email:"sample"+(i+1)+"@example.com",mobile:"07X XXX XXXX",church:"Sample church",district:"Sample district",conference:r[2],type:r[3],designation:r[4],auxiliary:r[5],consent:true,sample:true}));
  const park=[
    ["Rev.","Thabo Molefe","HJ 42 KL GP","White Toyota Corolla","P","paid","EFT","PMSMP1"],
    ["Sis.","Nomsa Dlamini","CX 18 TR GP","Silver VW Polo","A","paid","EFT","PMSMP2"],
    ["Bro.","Kagiso Seleka","FTG 812 NW","Grey Nissan NP200","A","pending","","PMSMP3"],
    ["Rev.","Lerato Mokoena","DPK 334 FS","Blue Hyundai i20","P","in","EFT","PMSMP4"]
  ].map((r,i)=>({code:"EBSMP"+(i+1),created:nowIso(),title:r[0],name:r[1],phone:"07X XXX XXXX",conference:"Sample",plate:r[2],car:r[3],bay:r[4],status:r[5],method:r[6],reg:r[7],paidAt:r[5]!=="pending"?nowIso():"",checkedAt:r[5]==="in"?nowIso():"",source:"Sample",sample:true}));
  return {regs,park};
}
function db(){let d=store.get("pm26",null);if(!d){d=seed();store.set("pm26",d)}return d}
function save(d){store.set("pm26",d)}
function pinRole(pin){for(const[k,v]of Object.entries(CONFIG.DEMO_PINS))if(v===pin)return k;return null}
function assignBay(parks,clergy){
  const used=id=>parks.filter(x=>x.bay===id&&x.status!=="cancel").length;
  if(clergy)return "P";
  for(const b of CONFIG.BAYS){if(b.clergy)continue;if(used(b.id)<b.cap)return b.id}
  return null;
}

async function api(action,p={}){
  if(LIVE){
    const r=await fetch(CONFIG.API_URL,{method:"POST",body:JSON.stringify({action,...p})});
    const j=await r.json();if(!j.ok)throw new Error(j.error||"Something went wrong");return j.data;
  }
  const d=db();
  const need=f=>{const r=pinRole(p.pin);if(!r||!f(r))throw new Error("You do not have access to this.");return r};
  const findP=c=>d.park.find(x=>x.code===String(c||"").toUpperCase().trim());
  const findR=c=>d.regs.find(x=>x.code===String(c||"").toUpperCase().trim());
  switch(action){
    case "register":{
      const em=String(p.email||"").toLowerCase().trim();
      const dup=d.regs.find(x=>x.email.toLowerCase()===em||digits(x.mobile).slice(-9)===digits(p.mobile).slice(-9));
      if(dup)throw new Error("You are already registered. Use Find my ticket.");
      let code;do{code=mkCode("PM")}while(findR(code));
      const rec={code,created:nowIso(),role:p.role||"",churchKey:p.churchKey||"",fee:"",title:p.title||"",surname:p.surname,names:p.names,email:em,mobile:p.mobile,church:p.church,district:p.district,conference:p.conference,type:p.type,designation:p.designation,auxiliary:p.auxiliary,consent:!!p.consent};
      d.regs.push(rec);save(d);return rec}
    case "getRegFull":{const r=findR(p.code);if(!r)throw new Error("No registration found with that code.");const ok=p.pin?!!(pinRole(p.pin)&&CAN.regDesk(pinRole(p.pin))):(digits(p.mobile).length>=9&&digits(p.mobile).slice(-9)===digits(r.mobile).slice(-9));if(!ok)throw new Error("That mobile number does not match this registration.");return r}
    case "editReg":{need(CAN.regDesk);const r=findR(p.code);if(!r)throw new Error("No registration found with that code.");Object.assign(r,cleanEdit(p.changes),{edited:nowIso(),editedBy:"desk"});save(d);return r}
    case "fixReg":{const r=findR(p.code);if(!r||digits(r.mobile).slice(-9)!==digits(p.mobile).slice(-9))throw new Error("That mobile number does not match this registration.");Object.assign(r,cleanEdit(p.changes),{edited:nowIso(),editedBy:"self"});save(d);return r}
    case "regFee":{need(CAN.regDesk);const r=findR(p.code);if(!r)throw new Error("No registration found with that code.");r.fee=p.paid?"paid":"";r.feeMethod=p.paid?(p.method||"EFT"):"";r.feePaidAt=p.paid?nowIso():"";save(d);return r}
    case "regFeeBulk":{need(CAN.regDesk);(p.codes||[]).forEach(c=>{const r=findR(c);if(r){r.fee=p.paid?"paid":"";r.feeMethod=p.paid?(p.method||"EFT"):"";r.feePaidAt=p.paid?nowIso():""}});save(d);return{done:(p.codes||[]).length}}
    case "churchStatus":return churchStatusOf(d.regs,p.key)
    case "publicStats":return publicStatsOf(d.regs)
    case "getReg":{const r=findR(p.code);if(!r)throw new Error("No registration found with that code.");return r}
    case "findReg":{const r=d.regs.find(x=>digits(x.mobile).slice(-9)===digits(p.mobile).slice(-9)&&x.surname.toLowerCase()===String(p.surname||"").toLowerCase().trim());if(!r)throw new Error("No registration matches that surname and mobile number.");return r}
    case "bayStats":{return CONFIG.BAYS.map(b=>({id:b.id,cap:b.cap,used:d.park.filter(x=>x.bay===b.id&&x.status!=="cancel").length}))}
    case "book":{
      const plate=normPlate(p.plate);
      if(d.park.some(x=>normPlate(x.plate)===plate&&x.status!=="cancel"))throw new Error("This car registration is already booked. Use Find my pass.");
      if(p.walkin)need(CAN.gate);
      const bay=assignBay(d.park,!!p.clergy);if(!bay)throw new Error("All general bays are full.");
      let code;do{code=mkCode("EB")}while(findP(code));
      const rec={code,created:nowIso(),title:p.title,name:p.name,phone:p.phone,church:p.church||"",district:p.district||"",conference:p.conference,plate:String(p.plate).toUpperCase(),car:p.car,bay,reg:p.reg||"",status:p.walkin?"paid":"pending",method:p.walkin?p.method:"",paidAt:p.walkin?nowIso():"",checkedAt:"",source:p.walkin?"Gate":"Online"};
      d.park.push(rec);save(d);return rec}
    case "getPass":{const r=findP(p.code);if(!r)throw new Error("No pass found with that code.");return r}
    case "findPass":{const r=d.park.find(x=>normPlate(x.plate)===normPlate(p.plate)&&digits(x.phone).slice(-4)===String(p.last4||""));if(!r)throw new Error("No booking matches that registration and phone number.");return r}
    case "auth":{const r=pinRole(p.pin);if(!r)throw new Error("That PIN is not correct.");return{role:r}}
    case "regList":need(CAN.regDesk);return d.regs
    case "parkList":need(CAN.gate);return d.park
    case "markPaid":{need(CAN.markPaid);const r=findP(p.code);r.status="paid";r.method=p.method||"EFT";r.paidAt=nowIso();save(d);return r}
    case "unpay":{need(CAN.markPaid);const r=findP(p.code);r.status="pending";r.method="";r.paidAt="";save(d);return r}
    case "checkin":{need(CAN.gate);const r=findP(p.code);if(!r)throw new Error("No pass found.");if(r.status==="pending")throw new Error("Payment not confirmed yet.");r.status="in";r.checkedAt=nowIso();save(d);return r}
    case "docList":return{docs:d.docs||[],now:store.get("pm26_now",null)}
    case "docUpload":{need(CAN.docs);d.docs=d.docs||[];const rec={id:mkCode(p.kind==="presentation"?"PR":"RP"),created:nowIso(),kind:p.kind,title:p.title,by:p.by||"",session:p.session||"",fileId:"",mime:p.mime,size:p.size||0,name:p.name,url:"data:"+p.mime+";base64,"+p.data};d.docs.push(rec);save(d);return rec}
    case "docDel":{need(CAN.docs);d.docs=(d.docs||[]).filter(x=>x.id!==p.id);save(d);const n=store.get("pm26_now",null);if(n&&n.id===p.id)store.set("pm26_now",null);return true}
    case "docShow":{need(CAN.docs);const x=(d.docs||[]).find(x=>x.id===p.id);const n=x?{id:x.id,kind:x.kind,title:x.title,by:x.by,fileId:x.fileId,url:x.url,mime:x.mime,at:nowIso()}:null;store.set("pm26_now",n);return{now:n}}
    case "reset":need(r=>r==="admin");store.set("pm26",seed());return true
  }
  throw new Error("Unknown action");
}

/* ============ HELPERS ============ */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const R=n=>"R"+Number(n).toLocaleString("en-ZA");
function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(t._t);t._t=setTimeout(()=>t.hidden=true,2600)}
const base=()=>CONFIG.SITE_URL||location.href.split("#")[0];
const role=()=>sess.get("pm_role"),pin=()=>sess.get("pm_pin");
const bayOf=id=>CONFIG.BAYS.find(b=>b.id===id)||{name:"Bay",short:"Bay"};
async function copy(t,m){try{await navigator.clipboard.writeText(t);toast(m||"Copied")}catch(e){toast("Select the text and copy it")}}
function chip(s){return{pending:'<span class="status st-pending">Awaiting payment</span>',paid:'<span class="status st-paid">Paid</span>',in:'<span class="status st-in">Parked</span>'}[s]||""}
function dlCsv(name,rows){const csv=rows.map(r=>r.map(v=>'"'+String(v??"").replace(/"/g,'""')+'"').join(",")).join("\r\n");const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["﻿"+csv],{type:"text/csv"}));a.download=name;a.click()}
function qr(el,text){try{new QRCode(el,{text,width:160,height:160,colorDark:"#151c2e",colorLight:"#ffffff",correctLevel:QRCode.CorrectLevel.M})}catch(e){el.textContent="QR unavailable"}}

function shell(inner,active,wide){
  const r=role();
  const tabs=[["home","Home"],["dashboard","Dashboard"],["register","Register"],["parking","Parking"],["worship","Worship"],["reports","Reports"],["presentations","Presentations"],["find","Find my ticket"]];
  if(r){if(CAN.regDesk(r))tabs.push(["regdesk","Registrations"],["backroom","Back room"]);if(CAN.parkDesk(r))tabs.push(["parkdesk","Parking desk"]);if(CAN.gate(r))tabs.push(["gate","Gate"])}
  else tabs.push(["team","Team login"]);
  return `<div class="wrap ${wide?"wide":""}">
  <header class="hero">
    <img class="crest" src="crest.png" alt="19th Episcopal District crest">
    <span class="eyebrow">19th Episcopal District · AME Church</span>
    <h1>${esc(CONFIG.APP)}</h1>
    <p style="opacity:.9">${esc(CONFIG.EVENT)}</p>
    <div class="facts"><span class="fact">${esc(CONFIG.DATES)}</span><span class="fact">${esc(CONFIG.HOST)}</span></div>
  </header>
  <nav class="tabs">${tabs.map(([h,l])=>`<a href="#${h}" ${active===h?'aria-current="page"':""}>${l}</a>`).join("")}</nav>
  ${r?`<p class="small muted">Signed in as <b>${ROLE_NAME[r]}</b>. <a href="#logout">Sign out</a></p>`:""}
  ${LIVE?"":`<div class="note demo small"><b>Preview mode.</b> Entries are saved on this phone only. Team PINs for the preview: organiser ${CONFIG.DEMO_PINS.admin}, registration ${CONFIG.DEMO_PINS.registration}, Ebenezer ${CONFIG.DEMO_PINS.ebenezer}, marshal ${CONFIG.DEMO_PINS.marshal}.</div>`}
  ${inner}</div>`;
}
function app(h){$("#app").innerHTML=h;document.querySelectorAll("[data-copy]").forEach(b=>b.onclick=()=>copy(b.dataset.copy))}

/* ============ HOME ============ */
function viewHome(){
  app(shell(`<section class="panel">
    <h2>Welcome</h2>
    <p>One app for the whole meeting. Register once, book your parking, and follow the worship from your phone.</p>
    <p class="small muted"><em>${esc(CONFIG.THEME)}</em> · Ephesians 3:20 to 21</p>
  </section>
  <div id="livebox"></div>
  <section class="panel"><h3>The week at Ebenezer</h3>
    <div class="prog">${CONFIG.PROGRAMME.map(x=>`<div class="prog-row"><b>${esc(x.day)}</b><span>${esc(x.what)}</span></div>`).join("")}</div>
  </section>
  <div class="cards">
    <a class="room" href="#register"><span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></span><b>Register</b><span>Delegates, clergy and observers</span></a>
    <a class="room" href="#parking"><span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 17h14v-5l-2-5H7l-2 5z"/><circle cx="8" cy="17" r="2"/><circle cx="16" cy="17" r="2"/><path d="M5 12h14"/></svg></span><b>Parking</b><span>Book a bay at Ebenezer for ${R(CONFIG.PARK_FEE)}</span></a>
    <a class="room" href="#worship"><span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg></span><b>Worship</b><span>Order of worship for each session</span></a>

async function liveBoard(){const box=$("#livebox");if(!box||!delegOn())return;let st;try{st=await api("publicStats")}catch(e){return}if(!$("#livebox"))return;
  const confs=["Natal Conference","East Conference","Orangia Conference","West Conference","M.M. Mokone Memorial Conference"];
  const known=c=>KNOWN.filter(k=>k.conference===c).length;let churches=0,complete=0;Object.values(st.conf).forEach(x=>{churches+=x.churches;complete+=x.complete});
  box.innerHTML=`<section class="panel"><span class="eyebrow" style="color:var(--brass)">Registration so far</span>
    <div class="live"><div><b>${st.total}</b><span>people registered</span></div><div><b>${churches}</b><span>churches represented</span></div><div><b>${complete}</b><span>delegations complete</span></div></div>
    ${confs.map(c=>{const x=st.conf[c]||{people:0,churches:0,complete:0},k=known(c);return `<div class="crow"><b>${esc(c.replace(" Conference",""))}</b><span class="muted">${x.people} registered · ${x.churches} of ${k} churches</span><div class="meter"><i style="width:${k?Math.min(100,Math.round(x.churches/k*100)):0}%"></i></div></div>`}).join("")}
    ${st.lead?homeLead(st):""}
    <div class="row"><a class="btn brass" href="#register" style="flex:1">Register now</a><button class="ghost" data-invite style="flex:1">Invite someone</button><a class="btn ghost" href="#dashboard" style="flex:1">Open the dashboard</a></div></section>`}
function homeLead(st){const top=(o,n)=>Object.entries(o||{}).sort((a,b)=>b[1]-a[1]).slice(0,n);
  const dl=rankDistricts(st.dist).slice(0,3);
  const ta=top(st.aux,3),medal=i=>["#c79a3a","#9aa3b6","#b06a3b"][i];
  const stat=(label,n,of)=>`<div class="lstat"><b>${n}</b><span>${esc(label)}${of?` <em>of ${of}</em>`:""}</span></div>`;
  return `<div class="lhead">Leadership present</div>
    <div class="lgrid">${LEAD_GROUPS.map(g=>stat(g.label,g.count?(st.clergy||0):(st.lead[g.id]||0),g.of?(ROSTER[g.id]||[]).length:0)).join("")}</div>
    ${dl.length?`<div class="lhead">Leading districts</div><ol class="rank">${dl.map((d,i)=>`<li><span class="medal" style="background:${medal(i)}">${i+1}</span><div><b>${esc(d.district)}</b><span>${esc(d.conference.replace(" Conference",""))} · ${d.churches}${d.known?" of "+d.known:""} churches · ${d.people} registered</span></div></li>`).join("")}</ol>`:""}
    ${ta.length?`<div class="lhead">Leading auxiliaries</div><ol class="rank">${ta.map(([k,n],i)=>`<li><span class="medal" style="background:${medal(i)}">${i+1}</span><div><b>${esc(k)}</b><span>${n} registered</span></div></li>`).join("")}</ol>`:""}`}

    ${rows.map(x=>`<tr><td class="mono"><a href="#pass-${esc(x.code)}" style="color:inherit">${esc(x.code)}</a></td><td>${esc(x.title)} ${esc(x.name)}${x.sample?' <span class="tag">Sample</span>':""}${x.bay==="P"?(onListName(x.name)?' <span class="tag">On clergy list</span>':' <span class="tag" style="background:var(--warn-soft)">Check clergy</span>'):""}<br><span class="muted small">${esc(x.phone)}</span></td><td class="mono">${esc(x.plate)}<br><span class="muted small" style="font-family:var(--f-body)">${esc(x.car)}</span></td><td>${esc(bayOf(x.bay).short)}</td><td>${chip(x.status)}${x.method?`<br><span class="muted small">${esc(x.method)}</span>`:""}</td><td>${x.status==="pending"?`<button class="okb" data-paid="${esc(x.code)}">EFT received</button>`:x.status==="paid"?`<button class="ghost" data-undo="${esc(x.code)}">Undo paid</button>`:""}</td></tr>`).join("")||'<tr><td colspan="6" class="muted">No bookings match.</td></tr>'}
    </tbody></table></div></section>
  <div class="grid2"><section class="panel"><h3>Money by method</h3><div class="bars">${["EFT","Cash","Card"].map(m=>`<div class="bar"><span>${m}</span><div class="track"><i style="width:${paid.length?Math.round(byM(m)/(paid.length*CONFIG.PARK_FEE)*100):0}%"></i></div><span>${R(byM(m))}</span></div>`).join("")}</div></section><section class="panel"><h3>Cars by bay</h3><div class="bars">${bars(byBay)}</div></section></div>`,"parkdesk",true));
  $("#flt").value=pf;$("#flt").onchange=e=>{pf=e.target.value;viewParkDesk()};$("#q").onchange=e=>{pq=e.target.value;viewParkDesk()};$("#rl").onclick=viewParkDesk;
  document.querySelectorAll("[data-paid]").forEach(b=>b.onclick=async()=>{b.disabled=true;try{await api("markPaid",{pin:pin(),code:b.dataset.paid,method:"EFT"});toast("Marked paid. The pass is now green.");viewParkDesk()}catch(e){toast(e.message)}});
  document.querySelectorAll("[data-undo]").forEach(b=>b.onclick=async()=>{try{await api("unpay",{pin:pin(),code:b.dataset.undo});viewParkDesk()}catch(e){toast(e.message)}});
  $("#csv").onclick=()=>dlCsv("Planning_Meeting_2026_Parking.csv",[["Code","Title","Name","Phone","Conference","Registration","Car","Bay","Status","Method","Paid at","Checked in at","Source"]].concat(all.map(x=>[x.code,x.title,x.name,x.phone,x.conference,x.plate,x.car,bayOf(x.bay).name,x.status,x.method,x.paidAt,x.checkedAt,x.source])));
}
async function viewGate(){
  if(!CAN.gate(role())){location.hash=role()?"home":"team";return}
  app(shell(`<section class="panel"><h2>Gate check</h2><p class="small muted">Scan the driver's QR code with this phone's camera and the pass opens with a check in button. No QR? Type the registration.</p>
    <form id="gf" novalidate><label for="gq">Registration or pass code<input id="gq" class="plate-in" autocomplete="off"></label><button type="submit">Look up</button></form><div id="gres"></div></section>
  <section class="panel"><h2>Walk in at the gate</h2><p class="small muted">Driver did not book? Take ${R(CONFIG.PARK_FEE)} and issue a pass here.</p>
    <form id="wf" novalidate><div class="grid2"><label for="wn">Title and full name<input id="wn"></label><label for="wp">WhatsApp number<input id="wp" inputmode="tel"></label></div>
      <div class="grid2"><label for="wr">Registration<input id="wr" class="plate-in" autocomplete="off"></label><label for="wm">Paid by<select id="wm"><option>Cash</option><option>Card</option><option>EFT</option></select></label></div>
      <label class="check" for="wc"><input type="checkbox" id="wc"> <span>Bishop, Presiding Elder or Pastor (Bay 1)</span></label>
      <p id="we" class="err" hidden></p><button type="submit" class="okb">Issue pass and check in</button></form></section>`,"gate"));
  $("#gf").onsubmit=async e=>{e.preventDefault();const q=$("#gq").value.trim();if(!q)return;try{const all=await api("parkList",{pin:pin()});const nq=normPlate(q),srt=s=>s.split("").sort().join(""),num=s=>(s.match(/\d+/g)||[]).join("");
    let m=all.filter(x=>x.code===q.toUpperCase()||normPlate(x.plate)===nq),close=false;
    if(!m.length&&nq.length>=4){close=true;m=all.filter(x=>{const p=normPlate(x.plate);return srt(p)===srt(nq)||p.includes(nq)||nq.includes(p)||(num(nq).length>=2&&num(p)===num(nq))})}
    const link=x=>`<a href="#pass-${esc(x.code)}" class="btn ghost" style="width:100%;margin-top:10px;text-align:left">${esc(x.plate)} · ${esc(x.title)} ${esc(x.name)} · ${esc(bayOf(x.bay).short)} ${chip(x.status)}</a>`;
    $("#gres").innerHTML=m.length?(close?`<p class="small muted" style="margin-top:10px">No exact match for ${esc(q.toUpperCase())}. Did you mean one of these? Check the plate on the car.</p>`:"")+m.map(link).join(""):`<p class="err" style="margin-top:10px">No booking for ${esc(q.toUpperCase())}. Use Walk in below.</p>`}catch(x){toast(x.message)}};
  $("#wf").onsubmit=async e=>{e.preventDefault();const v=id=>$("#"+id).value.trim();const er=$("#we");if(!v("wn")||!v("wr")){er.textContent="Name and registration are needed.";er.hidden=false;return}
    try{const parts=v("wn").split(" ");const t=["Rev.","Sis.","Bro.","Dr.","Mother","Bishop"].includes(parts[0])?parts.shift():"";
      const r=await api("book",{pin:pin(),walkin:true,method:v("wm"),title:t,name:parts.join(" "),phone:v("wp"),conference:"Walk in",plate:v("wr"),car:"",clergy:$("#wc").checked});
      await api("checkin",{pin:pin(),code:r.code});toast("Pass issued and checked in");location.hash="pass-"+r.code}catch(x){er.textContent=x.message;er.hidden=false}};
}

/* ============ REPORTS AND PRESENTATIONS (10 Nov 2026) ============
   Rev. Moobi's team and the organiser upload; everyone with the link reads. When a report or presentation is called,
   the team presses "Show to everyone now" and it opens by itself on every phone that has the app open. */
const KIND={report:{one:"report",many:"Reports",hash:"reports"},presentation:{one:"presentation",many:"Presentations",hash:"presentations"}};
const docUrl=x=>x.url||("https://drive.google.com/file/d/"+x.fileId+"/preview");
const docOpen=x=>x.url||("https://drive.google.com/file/d/"+x.fileId+"/view");
const docGet=x=>x.url||("https://drive.google.com/uc?export=download&id="+x.fileId);
const mb=n=>n?(Number(n)/1048576).toFixed(n>1048576?1:2)+" MB":"";
async function viewDocs(kind){
  const K=KIND[kind],team=role()&&CAN.docs(role());
  app(shell(`<section class="panel"><h2>${K.many}</h2><p class="muted small">Opening…</p></section>`,K.hash));
  let r;try{r=await api("docList",{})}catch(e){if(/Unknown action/.test(e.message))r={docs:[],now:null};else{app(shell(`<section class="panel"><h2>${K.many}</h2><p class="err">${esc(e.message)}</p></section>`,K.hash));return}}
  const list=(r.docs||[]).filter(x=>x.kind===kind),now=r.now;
  const groups={};list.forEach(x=>{const g=x.session||"";(groups[g]=groups[g]||[]).push(x)});
  const item=x=>`<div class="doc"><div><b>${esc(x.title)}</b>${x.by?`<span class="muted small">${esc(x.by)}</span>`:""}${now&&now.id===x.id?'<span class="tag" style="background:var(--ok-soft,#dff3e4)">Showing now</span>':""}</div>
    <div class="row"><button class="ghost" data-view="${esc(x.id)}">Open</button><a class="btn ghost" href="${esc(docGet(x))}" target="_blank" rel="noopener">Download</a>
    ${team?`${now&&now.id===x.id?`<button data-stop="1">Stop showing</button>`:`<button class="okb" data-show="${esc(x.id)}">Show to everyone now</button>`}<button class="ghost" data-del="${esc(x.id)}">Remove</button>`:""}</div></div>`;
  const body=list.length?Object.keys(groups).map(g=>`${g?`<h3>${esc(g)}</h3>`:""}${groups[g].map(item).join("")}`).join(""):`<p>The ${K.many.toLowerCase()} will appear here as they come in. When one is called at the meeting, it opens on your phone by itself.</p>`;
  const days=CONFIG.PROGRAMME.map(x=>x.day);
  app(shell(`<section class="panel"><h2>${K.many}</h2>${body}</section>
  ${team?`<section class="panel"><h2>Add a ${K.one}</h2><p class="small muted">PDF works best on every phone. Word and PowerPoint files also open. Up to about 40 MB.</p>
    <form id="df" novalidate><label for="dt">Title<input id="dt" placeholder="${kind==="report"?"Report of the Board of Christian Education":"Presentation on the 2027 budget"}"></label>
    <div class="grid2"><label for="db">Presented by<input id="db" placeholder="Rev. or Sis. full name, office"></label><label for="ds">Session<input id="ds" list="dsl" placeholder="Thursday 3 December"><datalist id="dsl">${days.map(d=>`<option value="${esc(d)}">`).join("")}</datalist></label></div>
    <label for="dfile">File<input id="dfile" type="file" accept=".pdf,.doc,.docx,.ppt,.pptx,.xls,.xlsx,image/*"></label>
    <p id="de" class="err" hidden></p><button type="submit">Upload</button></form></section>`:""}`,K.hash));
  document.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>{const x=list.find(y=>y.id===b.dataset.view);if(x)docOverlay(x,false)});
  document.querySelectorAll("[data-show]").forEach(b=>b.onclick=async()=>{b.disabled=true;try{const r=await api("docShow",{pin:pin(),id:b.dataset.show});NOW=r.now;nowBar();toast("Showing on every open phone now");viewDocs(kind)}catch(e){toast(e.message);b.disabled=false}});
  document.querySelectorAll("[data-stop]").forEach(b=>b.onclick=async()=>{try{await api("docShow",{pin:pin(),id:""});NOW=null;nowBar();toast("Stopped showing");viewDocs(kind)}catch(e){toast(e.message)}});
  document.querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{const x=list.find(y=>y.id===b.dataset.del);if(!x||!confirm("Remove \""+x.title+"\" from the app?"))return;try{await api("docDel",{pin:pin(),id:x.id});toast("Removed");viewDocs(kind)}catch(e){toast(e.message)}});
  const f=$("#df");if(f)f.onsubmit=async e=>{e.preventDefault();const er=$("#de"),file=$("#dfile").files[0],t=$("#dt").value.trim();er.hidden=true;
    if(!t||!file){er.textContent="Please give a title and choose the file.";er.hidden=false;return}
    if(file.size>40*1048576){er.textContent="This file is too big. Save it as a PDF and try again.";er.hidden=false;return}
    const btn=f.querySelector("button");btn.disabled=true;btn.textContent="Uploading… please keep this page open";
    try{const data=await new Promise((ok,no)=>{const rd=new FileReader();rd.onload=()=>ok(String(rd.result).split(",")[1]);rd.onerror=no;rd.readAsDataURL(file)});
      await api("docUpload",{pin:pin(),kind,title:t,by:$("#db").value.trim(),session:$("#ds").value.trim(),name:file.name,mime:file.type||"application/octet-stream",size:file.size,data});
      toast("Uploaded");viewDocs(kind)}catch(x){er.textContent=x.message;er.hidden=false;btn.disabled=false;btn.textContent="Upload"}};
}
function docOverlay(x,called){
  let o=$("#docov");if(o)o.remove();o=document.createElement("div");o.id="docov";o.dataset.called=called?"1":"";
  o.innerHTML=`<div class="dov-bar"><div><span class="eyebrow" style="color:inherit;opacity:.8">${called?"Now presenting":esc(KIND[x.kind]?KIND[x.kind].one:"document")}</span><b>${esc(x.title)}</b>${x.by?`<span class="small" style="opacity:.85">${esc(x.by)}</span>`:""}</div>
    <div class="row"><a class="btn ghost" href="${esc(docOpen(x))}" target="_blank" rel="noopener">Full screen</a><button class="ghost" id="dovx">Close</button></div></div>
    <iframe src="${esc(docUrl(x))}" title="${esc(x.title)}" allow="autoplay; fullscreen" allowfullscreen></iframe>`;
  document.body.appendChild(o);document.body.style.overflow="hidden";
  $("#dovx").onclick=()=>{o.remove();document.body.style.overflow=""};
}
/* What is being shown now: every open phone asks every 20 seconds (only while the app is on screen) */
let NOW=null;
function nowBar(){let b=$("#nowbar");if(!NOW){if(b)b.remove();return}
  if(!b){b=document.createElement("button");b.id="nowbar";document.body.appendChild(b)}
  b.innerHTML=`<span>Now presenting</span><b>${esc(NOW.title)}</b><span class="small">Tap to open</span>`;b.onclick=()=>docOverlay(NOW,true)}
async function pollNow(){if(document.visibilityState!=="visible")return;
  try{let n;if(LIVE){const r=await fetch(CONFIG.API_URL+"?now=1");const j=await r.json();n=j.data&&j.data.id?j.data:null}else n=store.get("pm26_now",null);
    const was=NOW&&NOW.id+"|"+NOW.at;NOW=n;nowBar();
    if(n&&n.id+"|"+n.at!==was&&store.get("pm_seen","")!==n.id+"|"+n.at){store.set("pm_seen",n.id+"|"+n.at);docOverlay(n,true)}
    if(!n){const o=$("#docov");if(o&&o.dataset.called)o.remove()}}catch(e){}}
setInterval(pollNow,20000);document.addEventListener("visibilitychange",pollNow);setTimeout(pollNow,1500);

/* ============ ROUTER ============ */
function route(){
  const h=(location.hash||"").slice(1);
  if(h==="logout"){sess.del("pm_pin");sess.del("pm_role");toast("Signed out");location.hash="home";return}
  if(h.startsWith("ticket-"))return viewTicket(h.slice(7));
  if(h.startsWith("card-"))return viewCard(h.slice(5));
  if(h.startsWith("edit-"))return viewEdit(h.slice(5),false);
  if(h.startsWith("deskedit-"))return viewEdit(h.slice(9),true);
  if(h.startsWith("pass-"))return viewPass(h.slice(5));
  if(h.startsWith("parking-"))return viewParking(h.slice(8));
  const m={dashboard:viewDashboard,register:viewRegister,parking:()=>viewParking(),worship:viewWorship,reports:()=>viewDocs("report"),presentations:()=>viewDocs("presentation"),find:viewFind,team:viewTeam,regdesk:viewRegDesk,backroom:viewBackroom,parkdesk:viewParkDesk,gate:viewGate};
  return (m[h]||viewHome)();
}
window.addEventListener("hashchange",()=>{route();window.scrollTo(0,0)});
route();
</script>
